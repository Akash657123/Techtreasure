<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Submissions</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      padding: 40px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #007BFF;
      color: white;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
    }
    .back-link a {
      color: #007BFF;
      text-decoration: none;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>Submitted Entries</h2>
  <table id="dataTable">
    <thead>
      <tr><th>Name</th><th>Email</th><th>Message</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="back-link">
    <p><a href="form.html">← Back to Form</a></p>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbxwv5YyUhLVysR66IFvsJHLQoZoF7qTBkjsq87-D_HVpe0XNgkbjJtyV_MoSyo3Ebw/exec";

    fetch(scriptURL)
      .then(response => response.json())
      .then(data => {
        const tbody = document.querySelector("#dataTable tbody");
        data.slice(1).forEach(row => {
          const tr = document.createElement("tr");
          row.forEach(cell => {
            const td = document.createElement("td");
            td.textContent = cell;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
      })
      .catch(error => console.error("Error loading data:", error));
  </script>
</body>
</html>
