<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to right, #f8f9fa, #e0eafc);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  #registrationForm {
    background-color: #ffffff;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    max-width: 420px;
    width: 100%;
    transition: transform 0.3s ease;
  }

  #registrationForm:hover {
    transform: scale(1.02);
  }

  #registrationForm h2 {
    text-align: center;
    margin-bottom: 1.5rem;
    color: #333;
  }

  #registrationForm input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.3s ease;
  }

  #registrationForm input:focus {
    border-color: #007bff;
    outline: none;
  }

  #registrationForm input[type="submit"] {
    background-color: #007bff;
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  #registrationForm input[type="submit"]:hover {
    background-color: #0056b3;
  }
</style>

<form id="registrationForm">
  <h2>📋 Student Registration</h2>
  <input type="text" name="studentName" placeholder="Student Name" required>
  <input type="date" name="dob" required>
  <input type="text" name="guardianName" placeholder="Guardian Name" required>
  <input type="tel" name="contact" placeholder="Contact Number" pattern="[0-9]{10}" required>
  <input type="text" name="class" placeholder="Class" required>
  <input type="submit" value="Register">
</form>

<script>
  document.getElementById("registrationForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const formData = new FormData(e.target);

    fetch("https://script.google.com/macros/s/AKfycbzBhVzVky41errJ2FE-Am_EmZicC36HWHIb939tPdChXN3CUl1dNwRPWXZOL84LAzLU/exec", {
      method: "POST",
      body: formData
    })
    .then(response => response.text())
    .then(data => alert(data))
    .catch(error => alert("Error: " + error));
  });
</script>
