<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f6f8;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background-color: #eaeaea;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    button {
      padding: 5px 10px;
      margin: 2px;
      cursor: pointer;
    }
    .edit-mode td input {
      width: 100%;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h1>Feedback Viewer</h1>
  <table id="feedbackTable">
    <thead></thead>
    <tbody></tbody>
  </table>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbxRxdm671v0kv28PLn6M1q9rnh23lTpiieBQpiEiAwd6x8AyDNumz1viYlkZrBcgL3C4Q/exec";

    function fetchData() {
      fetch(scriptURL)
        .then(response => response.json())
        .then(data => renderTable(data))
        .catch(error => console.error("Error loading data:", error));
    }

    function renderTable(data) {
      const tableHead = document.querySelector("#feedbackTable thead");
      const tableBody = document.querySelector("#feedbackTable tbody");
      tableHead.innerHTML = "";
      tableBody.innerHTML = "";

      // Create header row
      const headerRow = document.createElement("tr");
      data[0].forEach(header => {
        const th = document.createElement("th");
        th.textContent = header;
        headerRow.appendChild(th);
      });
      headerRow.appendChild(document.createElement("th")).textContent = "Actions";
      tableHead.appendChild(headerRow);

      // Create data rows
      data.slice(1).forEach((row, index) => {
        const tr = document.createElement("tr");

        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });

        const actionTd = document.createElement("td");

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.onclick = () => deleteEntry(row[1], row[2]);

        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.onclick = () => toggleEdit(tr, row);

        actionTd.appendChild(deleteBtn);
        actionTd.appendChild(editBtn);
        tr.appendChild(actionTd);

        tableBody.appendChild(tr);
      });
    }

    function deleteEntry(studentName, teacherName) {
      fetch(scriptURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          mode: "delete",
          studentName: studentName,
          teacherName: teacherName
        })
      })
      .then(res => res.text())
      .then(msg => {
        alert(msg);
        fetchData();
      });
    }

    function toggleEdit(row, originalData) {
      if (row.classList.contains("edit-mode")) {
        // Save changes
        const inputs = row.querySelectorAll("input");
        const updatedData = Array.from(inputs).map(input => input.value);

        fetch(scriptURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mode: "delete",
            studentName: originalData[1],
            teacherName: originalData[2]
          })
        })
        .then(() => {
          return fetch(scriptURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              studentName: updatedData[1],
              teacherName: updatedData[2],
              subject: updatedData[3],
              communication: updatedData[4],
              behavior: updatedData[5],
              punctuality: updatedData[6],
              clarity: updatedData[7],
              overall: updatedData[8],
              comments: updatedData[9]
            })
          });
        })
        .then(res => res.text())
        .then(msg => {
          alert("Updated: " + msg);
          fetchData();
        });

      } else {
        // Switch to edit mode
        row.classList.add("edit-mode");
        for (let i = 1; i < row.cells.length - 1; i++) {
          const cell = row.cells[i];
          const input = document.createElement("input");
          input.value = cell.textContent;
          cell.textContent = "";
          cell.appendChild(input);
        }
        row.querySelector("button:nth-child(2)").textContent = "Save";
      }
    }

    fetchData();
  </script>
</body>
</html>
