<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback Viewer</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .viewer-container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 900px;
      overflow-x: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #f0f0f0;
    }

    button {
      padding: 5px 10px;
      background-color: #74ebd5;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background-color: #57c6c6;
    }
  </style>
</head>
<body>
  <div class="viewer-container">
    <h2>Submitted Feedback</h2>
    <table id="feedbackTable">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbz8wfI-sXVJT_BU6uDes8Rn4AWw_w0QKnFP6XRaN2lNaCBVEQsJWnGublUzI2v7jgJ2lg/exec";

    function fetchFeedback() {
      fetch(scriptURL)
        .then(response => response.json())
        .then(data => renderTable(data))
        .catch(error => console.error("Error fetching data:", error));
    }

    function renderTable(data) {
      const tableHead = document.querySelector("#feedbackTable thead");
      const tableBody = document.querySelector("#feedbackTable tbody");
      tableHead.innerHTML = "";
      tableBody.innerHTML = "";

      // Create header row
      const headerRow = document.createElement("tr");
      data[0].forEach(header => {
        const th = document.createElement("th");
        th.textContent = header;
        headerRow.appendChild(th);
      });
      headerRow.appendChild(document.createElement("th")).textContent = "Actions";
      tableHead.appendChild(headerRow);

      // Create data rows
      data.slice(1).forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });

        const actionTd = document.createElement("td");
        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.onclick = () => deleteEntry(row[1], row[2]); // studentName, teacherName
        actionTd.appendChild(deleteBtn);
        tr.appendChild(actionTd);

        tableBody.appendChild(tr);
      });
    }

    function deleteEntry(studentName, teacherName) {
      fetch(scriptURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        mode: "no-cors",
        body: JSON.stringify({
          mode: "delete",
          studentName: studentName,
          teacherName: teacherName
        })
      })
      .then(() => {
        alert("Entry deleted.");
        fetchFeedback();
      })
      .catch(error => {
        console.error("Delete failed:", error);
      });
    }

    fetchFeedback();
  </script>
</body>
</html>
