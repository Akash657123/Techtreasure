
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>View Teacher Feedback</title>
  <link rel="stylesheet" href="style/style.css" />
</head>
<body>
  <div class="container">
    <h2>Submitted Teacher Feedback</h2>
    <table id="feedbackTable">
      <thead>
        <tr>
          <th>Student Name</th>
          <th>Teacher</th>
          <th>Subject</th>
          <th>Communication</th>
          <th>Behaviour</th>
          <th>Punctuality</th>
          <th>Clarity</th>
          <th>Overall</th>
          <th>Comments</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="back-link">
      <p><a href="Feedbackform.html">← Back to Feedback Form</a></p>
    </div>
  </div>

  <!-- Modal -->
  <div id="confirmModal" class="modal">
    <div class="modal-content">
      <p id="confirmText">Are you sure you want to delete this entry?</p>
      <div class="modal-buttons">
        <button id="confirmYes">Yes</button>
        <button id="confirmNo">No</button>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
