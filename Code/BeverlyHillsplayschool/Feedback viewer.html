<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Teacher Feedback</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ACB6E5, #74ebd5);
      padding: 40px;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      max-width: 1000px;
      margin: auto;
      overflow-x: auto;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #74ebd5;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    button {
      padding: 6px 10px;
      background-color: #ff4d4d;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e60000;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #007BFF;
      text-decoration: none;
      font-weight: bold;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Submitted Teacher Feedback</h2>
    <table id="feedbackTable">
      <thead>
        <tr>
          <th>Student Name</th>
          <th>Teacher</th>
          <th>Subject</th>
          <th>Communication</th>
          <th>Behaviour</th>
          <th>Punctuality</th>
          <th>Clarity</th>
          <th>Overall</th>
          <th>Comments</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="back-link">
      <p><a href="form.html">← Back to Feedback Form</a></p>
    </div>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwS0oWikrb0jIL_geLSWJPNUgDvgu_hqjpAAIVfXNQystkNVtVlRA0KxjI3Oqyvt76PLg/exec";

    fetch(scriptURL)
      .then(response => response.json())
      .then(data => {
        const tbody = document.querySelector('#feedbackTable tbody');
        data.slice(1).forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${row[1]}</td>
            <td>${row[2]}</td>
            <td>${row[3]}</td>
            <td>${row[4]}</td>
            <td>${row[5]}</td>
            <td>${row[6]}</td>
            <td>${row[7]}</td>
            <td>${row[8]}</td>
            <td>${row[9]}</td>
            <td><button onclick="deleteEntry('${row[1]}', '${row[2]}', this)">Delete</button></td>
          `;
          tbody.appendChild(tr);
        });
      });

    function deleteEntry(studentName, teacherName, button) {
      fetch(scriptURL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: "delete", studentName, teacherName })
      })
      .then(() => {
        const row = button.closest('tr');
        row.remove();
      })
      .catch(err => {
        console.error('Delete failed:', err);
        alert('Could not delete entry.');
      });
    }
  </script>
</body>
</html>
