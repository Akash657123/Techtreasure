<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Food Online</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fff8f0;
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      background: #ff7043;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      padding: 1rem;
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }
    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
    }
    .card h3 {
      margin: 0.5rem 0 0.2rem;
    }
    .card p {
      margin: 0.2rem 0 0.8rem;
    }
    button {
      background: #ff7043;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background: #e64a19;
    }
    .cart, .checkout {
      padding: 1rem;
      max-width: 800px;
      margin: auto;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .cart-items {
      margin-top: 1rem;
    }
    #upiField {
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

<header>
  <h1>🍕 Order Your Favorite Food</h1>
</header>

<section class="menu">
  <div class="card">
    <img src="https://source.unsplash.com/featured/?pizza" alt="Margherita Pizza" />
    <h3>Margherita Pizza</h3>
    <p>₹250</p>
    <button onclick="addToCart('Margherita Pizza', 250)">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://source.unsplash.com/featured/?burger" alt="Veg Burger" />
    <h3>Veg Burger</h3>
    <p>₹150</p>
    <button onclick="addToCart('Veg Burger', 150)">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://source.unsplash.com/featured/?wrap" alt="Paneer Wrap" />
    <h3>Paneer Wrap</h3>
    <p>₹180</p>
    <button onclick="addToCart('Paneer Wrap', 180)">Add to Cart</button>
  </div>
</section>

<section class="cart">
  <h2>Your Cart</h2>
  <div class="cart-items" id="cartItems"></div>
  <p><strong>Total: ₹<span id="total">0</span></strong></p>
</section>

<section class="checkout">
  <h2>Delivery Address</h2>
  <input type="text" id="address" placeholder="Enter your address here" />

  <h3>Select Payment Method</h3>
  <label><input type="radio" name="payment" value="UPI" checked /> UPI</label><br>
  <label><input type="radio" name="payment" value="COD" /> Cash on Delivery</label>

  <div id="upiField">
    <input type="text" id="upiId" placeholder="Enter your UPI ID (e.g., name@upi)" />
  </div>

  <br><br>
  <button onclick="checkout()">Checkout & Pay</button>
</section>

<script>
  let cart = [];
  let total = 0;

  function addToCart(item, price) {
    cart.push({ item, price });
    total += price;
    updateCart();
  }

  function updateCart() {
    const cartItems = document.getElementById('cartItems');
    cartItems.innerHTML = '';
    cart.forEach(entry => {
      const div = document.createElement('div');
      div.textContent = `${entry.item} - ₹${entry.price}`;
      cartItems.appendChild(div);
    });
    document.getElementById('total').textContent = total;
  }

  function checkout() {
    const address = document.getElementById('address').value.trim();
    const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
    const upiId = document.getElementById('upiId').value.trim();

    if (!address) {
      alert('Please enter a delivery address.');
      return;
    }

    if (paymentMethod === 'UPI' && !upiId) {
      alert('Please enter your UPI ID.');
      return;
    }

    let message = `✅ Order placed!\nTotal: ₹${total}\nDelivery to: ${address}\nPayment Method: ${paymentMethod}`;
    if (paymentMethod === 'UPI') {
      message += `\nUPI ID: ${upiId}`;
    }

    alert(message);
    cart = [];
    total = 0;
    updateCart();
    document.getElementById('address').value = '';
    document.getElementById('upiId').value = '';
  }

  document.querySelectorAll('input[name="payment"]').forEach(radio => {
    radio.addEventListener('change', () => {
      const upiField = document.getElementById('upiField');
      upiField.style.display = radio.value === 'UPI' ? 'block' : 'none';
    });
  });
</script>

</body>
</html>
