<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Food Online</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <h1>🍕 Order your food from Shrishti Kitchen with love</h1>
</header>

<section class="menu">
  <!-- Food Cards -->
  <div class="card">
    <img src="chickenchilly.jfif" alt="Chicken Chilly" />
    <h3>Chicken Chilly</h3>
    <p>₹250</p>
    <button onclick="addToCart('Chicken Chilly', 250)">Add to Cart</button>
  </div>
  <div class="card">
    <img src="bhindi masala.jfif" alt="Veg Burger" />
    <h3>Bhindi Masala</h3>
    <p>₹150</p>
    <button onclick="addToCart('Veg Burger', 150)">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://source.unsplash.com/featured/?wrap" alt="Paneer Wrap" />
    <h3>Soya Chilli</h3>
    <p>₹180</p>
    <button onclick="addToCart('Paneer Wrap', 180)">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://source.unsplash.com/featured/?pizza" alt="Margherita Pizza" />
    <h3>Margherita Pizza</h3>
    <p>₹300</p>
    <button onclick="addToCart('Margherita Pizza', 300)">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://source.unsplash.com/featured/?pasta" alt="White Sauce Pasta" />
    <h3>White Sauce Pasta</h3>
    <p>₹220</p>
    <button onclick="addToCart('White Sauce Pasta', 220)">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://source.unsplash.com/featured/?fries" alt="French Fries" />
    <h3>French Fries</h3>
    <p>₹120</p>
    <button onclick="addToCart('French Fries', 120)">Add to Cart</button>
  </div>
</section>

<section class="cart">
  <h2>Your Cart</h2>
  <div class="cart-items" id="cartItems"></div>
  <p><strong>Total: ₹<span id="total">0</span></strong></p>
</section>

<section class="checkout">
  <h2>Delivery Address</h2>
  <input type="text" id="address" placeholder="Enter your address here" />

  <h3>Select Payment Method</h3>
  <label><input type="radio" name="payment" value="UPI" checked /> UPI</label><br>
  <label><input type="radio" name="payment" value="COD" /> Cash on Delivery</label>

  <div id="upiField">
    <input type="text" id="upiId" placeholder="Enter your UPI ID (e.g., name@upi)" />
  </div>

  <br><br>
  <button onclick="checkout()">Checkout & Pay</button>
</section>

<script>
  let cart = [];
  let total = 0;

  function showCartFeedback(item) {
    const feedback = document.createElement('div');
    feedback.className = 'cart-feedback';
    feedback.textContent = `${item} added to cart!`;
    document.body.appendChild(feedback);
    setTimeout(() => feedback.remove(), 1000);
  }

  function addToCart(item, price) {
    cart.push({ item, price });
    total += price;
    updateCart();
    showCartFeedback(item);
  }

  function updateCart() {
    const cartItems = document.getElementById('cartItems');
    cartItems.innerHTML = '';
    cart.forEach(entry => {
      const div = document.createElement('div');
      div.textContent = `${entry.item} - ₹${entry.price}`;
      cartItems.appendChild(div);
    });

    const totalEl = document.getElementById('total');
    totalEl.textContent = total;
    totalEl.classList.add('total-animate');
    setTimeout(() => totalEl.classList.remove('total-animate'), 400);
  }

  function checkout() {
    const address = document.getElementById('address').value.trim();
    const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
    const upiId = document.getElementById('upiId').value.trim();

    if (!address) {
      alert('Please enter a delivery address.');
      return;
    }

    if (paymentMethod === 'UPI' && !upiId) {
      alert('Please enter your UPI ID.');
      return;
    }

    const paymentStatus = paymentMethod === 'UPI' ? 'Success' : 'Pending';

    const orderData = {
      items: cart.map(entry => entry.item),
      total,
      address,
      paymentMethod,
      upiId,
      paymentStatus
    };

    fetch('', {
      method: 'POST',
      body: JSON.stringify(orderData),
      headers: { 'Content-Type': 'application/json' }
    })
    .then(() => {
      alert(`🎉 Order placed!\nTotal: ₹${total}\nDelivery to: ${address}\nPayment Method: ${paymentMethod}`);
      cart = [];
      total = 0;
      updateCart();
      document.getElementById('address').value = '';
      document.getElementById('upiId').value = '';
    })
    .catch(err => {
      alert('❌ Failed to send order to Google Sheets.');
      console.error(err);
    });
  }

  document.querySelectorAll('input[name="payment"]').forEach(radio => {
    radio.addEventListener('change', () => {
      document.getElementById('upiField').style.display = radio.value === 'UPI' ? 'block' : 'none';
    });
  });
</script>

</body>
</html>
