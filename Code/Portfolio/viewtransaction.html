<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Viewer</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f8;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    th {
      background: #0078D4;
      color: white;
    }
    button {
      padding: 5px 10px;
      background: #d9534f;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #c9302c;
    }
  </style>
</head>
<body>
  <h2>Transaction History</h2>
  <table id="transactionTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Description</th>
        <th>Timestamp (IST)</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwHfQHZ3n_b643LKDMPJsSTr7YWsgnXYozmELNiYOfNgLlgjgBa3fldBFcILAWmZq5JcA/exec';

    function formatDateDDMMYYYY(dateStr) {
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) return dateStr;
      if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
        const [y, m, d] = dateStr.split("-");
        return `${d}/${m}/${y}`;
      }
      const date = new Date(dateStr);
      if (!isNaN(date)) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${day}/${month}/${year}`;
      }
      return dateStr;
    }

    function formatIST(timestampStr) {
      const date = new Date(timestampStr);
      if (isNaN(date)) return timestampStr;
      const utc = date.getTime() + (date.getTimezoneOffset() * 60000);
      const istOffset = 5.5 * 60 * 60000;
      const istDate = new Date(utc + istOffset);
      const day = String(istDate.getDate()).padStart(2, '0');
      const month = String(istDate.getMonth() + 1).padStart(2, '0');
      const year = istDate.getFullYear();
      const hours = String(istDate.getHours()).padStart(2, '0');
      const minutes = String(istDate.getMinutes()).padStart(2, '0');
      const seconds = String(istDate.getSeconds()).padStart(2, '0');
      return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
    }

    fetch(scriptURL)
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector('#transactionTable tbody');
        data.forEach(tx => {
          const formattedDate = formatDateDDMMYYYY(tx.Date || '');
          const formattedTimestamp = formatIST(tx.Timestamp || '');
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${formattedDate}</td>
            <td>${tx.Type || ''}</td>
            <td>₹${tx.Amount || '0'}</td>
            <td>${tx.Description || ''}</td>
            <td>${formattedTimestamp}</td>
            <td><button onclick='deleteRow("${tx.Date}", "${tx.Type}", "${tx.Amount}", "${tx.Description}")'>🗑️ Delete</button></td>
          `;
          tbody.appendChild(row);
        });
      })
      .catch(err => {
        console.error("Error loading data:", err);
        alert("Failed to load transactions.");
      });

    function deleteRow(date, type, amount, description) {
      if (!confirm("Are you sure you want to delete this transaction?")) return;

      const payload = {
        mode: "delete",
        date: date,
        type: type,
        amount: amount,
        description: description
      };

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(payload),
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(() => {
        alert("Delete request sent!");
        location.reload();
      })
      .catch(err => {
        console.error("Delete failed:", err);
        alert("Failed to delete transaction.");
      });
    }
  </script>
</body>
</html>
