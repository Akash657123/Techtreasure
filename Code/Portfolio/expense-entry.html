<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Expense</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #f4f6f8, #e0e7ef);
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #444;
    }

    input[type="date"],
    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      background: #0078D4;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
    }

    button:hover {
      background: #005fa3;
    }

    .link {
      text-align: center;
      margin-top: 25px;
    }

    .link a {
      text-decoration: none;
      background: #0078D4;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      display: inline-block;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Add Expense</h2>
    <form id="expenseForm">
      <label for="date">Date</label>
      <input type="date" id="date" required />

      <label for="amount">Amount</label>
      <input type="number" id="amount" required />

      <label for="detail">Expense Detail</label>
      <input type="text" id="detail" required />

      <button type="submit">Submit</button>
    </form>

    <div class="link">
      <a href="expense-viewer.html">View Expenses</a>
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycby7Vkh8fnUUoZ4_7nCJc1_CtTiy476qMI51VorcEknZqmrJj_aBk9iwNOysOODTq7gF8A/exec'; // Replace with your Apps Script URL

    document.getElementById('expenseForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const data = {
        mode: "create",
        date: document.getElementById('date').value,
        amount: document.getElementById('amount').value,
        detail: document.getElementById('detail').value
      };

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(data),
        headers: { 'Content-Type': 'application/json' }
      });

      alert("Expense submitted!");
      this.reset();
    });
  </script>
</body>
</html>
