<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: linear-gradient(to bottom right, #f4f6f8, #e0e7ef);
    }

    .parallax {
      background-image: url('https://images.unsplash.com/photo-1605902711622-cfb43c4437d1?auto=format&fit=crop&w=1600&q=80');
      height: 250px;
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2.5em;
      font-weight: bold;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.6);
    }

    .container {
      padding: 30px 20px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
      font-weight: 600;
    }

    form {
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      transition: box-shadow 0.3s ease;
    }

    form:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      color: #555;
      font-size: 0.95em;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
      background: linear-gradient(to right, #f9f9f9, #f1f1f1);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
      transition: border-color 0.3s ease;
    }

    input:focus, select:focus {
      border-color: #0078D4;
      outline: none;
      background: #fff;
    }

    button {
      margin-top: 25px;
      padding: 14px;
      background: #0078D4;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #005fa3;
    }

    .cli-output {
      margin-top: 25px;
      padding: 15px;
      background: #e8f0fe;
      border-left: 4px solid #0078D4;
      font-family: monospace;
      color: #333;
      border-radius: 6px;
    }

    .cli-output a {
      color: #0078D4;
      text-decoration: underline;
    }

    .link {
      text-align: center;
      margin-top: 30px;
    }

    .link a {
      text-decoration: none;
      background: #0078D4;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      display: inline-block;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .link a:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <div class="parallax">Transaction Portal</div>

  <div class="container">
    <h2>Enter or Delete Transaction</h2>
    <form id="transactionForm">
      <label for="mode">🔄 Mode</label>
      <select id="mode" required>
        <option value="create">Create</option>
        <option value="delete">Delete</option>
      </select>

      <label for="date">📅 Transaction Date</label>
      <input type="date" id="date" required />

      <label for="type">💳 Type</label>
      <select id="type" required>
        <option value="">Select</option>
        <option value="Credit">Credit</option>
        <option value="Debit">Debit</option>
      </select>

      <label for="amount">💰 Amount</label>
      <input type="number" id="amount" min="0" required />

      <label for="description">📝 Description</label>
      <input type="text" id="description" required />

      <button type="submit">Submit</button>
    </form>

    <div class="link">
      <a href="viewtransaction.html">View Transactions</a>
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwHfQHZ3n_b643LKDMPJsSTr7YWsgnXYozmELNiYOfNgLlgjgBa3fldBFcILAWmZq5JcA/exec';

    const form = document.getElementById('transactionForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const data = {
        mode: document.getElementById('mode').value,
        date: document.getElementById('date').value,
        type: document.getElementById('type').value,
        amount: document.getElementById('amount').value,
        description: document.getElementById('description').value
      };

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(data),
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(() => {
        const output = document.createElement('div');
        output.className = 'cli-output';
        output.innerHTML = `
          ✅ ${data.mode === "delete" ? "Delete request sent." : "Transaction saved."}<br>
          👉 <a href="view.html">Click here to view transactions</a>
        `;
        document.querySelector('.container').appendChild(output);
        form.reset();
      })
      .catch(err => {
        console.error("Error:", err);
        alert("Failed to process transaction.");
      });
    });
  </script>
</body>
</html>
