<input type="file" id="fileInput" />
<button onclick="uploadFile()">Upload</button>

<script>
  async function uploadFile() {
    const file = document.getElementById('fileInput').files[0];
    const reader = new FileReader();

    reader.onload = async () => {
      const base64 = reader.result.split(',')[1];
      const payload = {
        folderId: '1Bd8uufIR61y331ce1nzmYgxUfI-NgtkD',
        fileName: file.name,
        mimeType: file.type,
        fileData: base64
      };

      const response = await fetch('https://script.google.com/macros/s/AKfycbzJY2bey91SOlylK6IDPPxk3PmvghPs1pDRrbHbcEqo_n5b8j33FuiylhjR7GNZCtA0/exec',
                                   {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'application/json' }
      });

      const result = await response.json();
      if (result.success) {
        alert('Uploaded: ' + result.fileUrl);
      } else {
        alert('Error: ' + result.error);
      }
    };

    reader.readAsDataURL(file);
  }
</script>
