<input type="file" id="fileInput" />
<button onclick="uploadFile()">Upload</button>

<script>
  async function uploadFile() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) {
      alert("Please select a file.");
      return;
    }

    const reader = new FileReader();
    reader.onload = async () => {
      const base64 = reader.result.split(',')[1];

      const payload = {
        folderId: '1Bd8uufIR61y331ce1nzmYgxUfI-NgtkD',
        fileName: file.name,
        mimeType: file.type,
        fileData: base64
      };

      try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbzJY2bey91SOlylK6IDPPxk3PmvghPs1pDRrbHbcEqo_n5b8j33FuiylhjR7GNZCtA0/exec', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();  // Only works if CORS is enabled on server
        if (result.success) {
          alert('Uploaded: ' + result.fileUrl);
        } else {
          alert('Error: ' + result.error);
        }
      } catch (err) {
        console.error('Upload failed:', err);
        alert('Upload failed. See console for details.');
      }
    };

    reader.readAsDataURL(file);
  }
</script>
