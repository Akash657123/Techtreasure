<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Viewer</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f8;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    th {
      background: #0078D4;
      color: white;
    }
    button {
      padding: 5px 10px;
      background: #d9534f;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #c9302c;
    }
  </style>
</head>
<body>
  <h2>Transaction History</h2>
  <table id="transactionTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Description</th>
        <th>Timestamp</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwS2hhUEdd3hC_Pq1qJ-Cg3_g_cmEXCdTuPVczFy1a02ck8eH4ukjfovMF1dGzghdKhPQ/exec'; // Replace with your Apps Script URL

    fetch(scriptURL)
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector('#transactionTable tbody');
        data.forEach((tx, index) => {
          const rowIndex = index + 2; // +2 for header and 1-based index
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${tx.Date || ''}</td>
            <td>${tx.Type || ''}</td>
            <td>₹${tx.Amount || '0'}</td>
            <td>${tx.Description || ''}</td>
            <td>${tx.Timestamp || ''}</td>
            <td><button onclick="deleteRow(${rowIndex})">🗑️ Delete</button></td>
          `;
          tbody.appendChild(row);
        });
      })
      .catch(err => {
        console.error("Error loading data:", err);
        alert("Failed to load transactions.");
      });

    function deleteRow(rowIndex) {
      if (!confirm("Are you sure you want to delete this transaction?")) return;

      fetch(scriptURL, {
        method: 'DELETE',
        body: JSON.stringify({ row: rowIndex }),
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(res => res.text())
      .then(msg => {
        alert("Transaction deleted!");
        location.reload();
      })
      .catch(err => {
        console.error("Delete failed:", err);
        alert("Failed to delete transaction.");
      });
    }
  </script>
</body>
</html>
