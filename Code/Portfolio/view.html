<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Viewer</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f8;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    th {
      background: #0078D4;
      color: white;
    }
  </style>
</head>
<body>
  <h2>Transaction History</h2>
  <table id="transactionTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Description</th>
        <th>Timestamp</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    fetch('YOUR_SCRIPT_URL') // Replace with your actual Apps Script URL
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector('#transactionTable tbody');
        data.forEach(tx => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${tx.Date || ''}</td>
            <td>${tx.Type || ''}</td>
            <td>₹${tx.Amount || '0'}</td>
            <td>${tx.Description || ''}</td>
            <td>${tx.Timestamp || ''}</td>
          `;
          tbody.appendChild(row);
        });
      })
      .catch(err => {
        console.error("Error loading data:", err);
        alert("Failed to load transactions.");
      });
  </script>
</body>
</html>
